name: Diagnóstico do catálogo

on:
  push:
    paths:
      - .github/workflows/catalogo.yml
  workflow_dispatch:
    inputs:
      kind:
        description: Catálogo a verificar
        required: true
        default: courses
        type: choice
        options:
          - courses
          - jobs

permissions:
  contents: read

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIRST_JOB_DATABASE: /tmp/firstjob-usuarios-teste.db
      FIRST_JOB_UPLOAD_DIR: /tmp/firstjob-uploads-teste
      FIRST_JOB_CATALOG_DATABASE: /tmp/firstjob-catalogo-teste.db
      CATALOG_KIND: ${{ inputs.kind || 'courses' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar o backend
        run: python -m unittest discover -s tests -v
      - name: Diagnosticar configuração das fontes
        shell: bash
        env:
          FIRST_JOB_CATALOG_DATABASE: ${{ runner.temp }}/catalogo-diagnostico.db
        run: |
          mkdir -p relatorio-catalogo
          python scripts/atualizar_catalogo.py --kind "$CATALOG_KIND" --diagnose | tee relatorio-catalogo/resultado.json
      - name: Disponibilizar diagnóstico
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-catalogo-${{ github.run_id }}
          path: relatorio-catalogo/resultado.json
          if-no-files-found: warn
          retention-days: 7
